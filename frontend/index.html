    <!-- Google Analytics: consent defaults to denied, and gtag.js loads only
         after the visitor accepts. External (public/ga-init.js) so the CSP
         needs no script-src 'unsafe-inline'. `defer` keeps it off the
         render-blocking path; deferred classic scripts and module scripts run
         in document order, so this still runs before the app bundle that
         calls window.loadGoogleAnalytics(). -->

    <!-- Self-hosted fonts (public/fonts/, SIL OFL 1.1; licenses alongside).
         Latin subsets only. Inline so there is no CSS -> woff2 request chain;
         the two faces used above the fold (body text and headings) are
         preloaded. Quantico italic is never used, so it is not shipped. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-v31-latin-wght-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/quantico-v19-latin-700-normal.woff2" crossorigin>
    <style>

    <!-- The About-section headshot is the LCP element; fetch it early.
         imagesrcset must stay identical to the <img srcSet> that
         buildHeadshotSrcSet() produces in about.tsx, so the browser picks the
         same density variant for both (2x on most phones and laptops). No
         `href` on purpose: a browser without imagesrcset support skips the
         preload instead of fetching a fixed variant it may not render. -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high"
          imagesrcset="/images/headshot/headshot-1x.webp 1x, /images/headshot/headshot-2x.webp 2x, /images/headshot/headshot.webp 3x">
