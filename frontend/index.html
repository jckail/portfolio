    <!-- Self-hosted fonts (public/fonts/, SIL OFL 1.1; licenses alongside).
         Latin subsets only. Inline so there is no CSS -> woff2 request chain;
         the two faces used above the fold (body text and headings) are
         preloaded. Quantico italic is never used, so it is not shipped. -->

    <style>
      /* Server-rendered snapshot of the portfolio (see spa.py). It exists for
         readers that do not run JavaScript, and React replaces it on mount, so
         it is visually hidden (still in the accessibility tree) to avoid a
         flash or layout shift. <noscript> below shows it to no-JS visitors. */
      #seo-snapshot {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url(/fonts/montserrat-v31-latin-wght-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {

        font-weight: 300 800;
        font-display: swap;
        src: url(/fonts/montserrat-v31-latin-wght-italic.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

    <!-- The About-section headshot is the LCP element; fetch it early.
         imagesrcset must stay identical to the <img srcSet> that
         buildHeadshotSrcSet() produces in about.tsx, so the browser picks the
         same density variant for both (2x on most phones and laptops). No
         `href` on purpose: a browser without imagesrcset support skips the
         preload instead of fetching a fixed variant it may not render. -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high"
          imagesrcset="/images/headshot/headshot-1x.webp 1x, /images/headshot/headshot-2x.webp 2x, /images/headshot/headshot.webp 3x">
