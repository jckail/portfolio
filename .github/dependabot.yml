version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns: ["*"]

  # e2e/package-lock.json is installed by CI (Playwright + Lighthouse) but had
  # no coverage here, so advisories against it - including the currently open
  # extract-zip one - would never produce an automated bump.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      pip-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
