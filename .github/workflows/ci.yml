name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Test (with coverage gate)
      run: npm run test:coverage

    - name: Build
      run: npm run build

  backend:
    name: Backend (compile, test)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Lint (ruff)
      run: python -m ruff check backend

    - name: Byte-compile backend
      run: python -m compileall -q backend

    - name: Test (with coverage gate)
      run: python -m pytest backend/tests -q --cov --cov-report=term-missing

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '~1.9'

    - name: Format check
      run: terraform fmt -check -recursive

    - name: Init (no backend)
      run: terraform init -backend=false

    - name: Validate
      run: terraform validate

  docker:
    name: Docker (build production image)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: helpers/Dockerfile.prod
        push: false
        load: true
        tags: portfolio-ci:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image for critical/high CVEs
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: portfolio-ci:latest
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true

    - name: Run container for E2E smoke test
      run: |
        docker run -d --name portfolio-e2e -p 18080:8080 \
          -e PORT=8080 \
          -e SUPABASE_URL=https://example.supabase.co \
          -e SUPABASE_ANON_KEY=x -e SUPABASE_SERVICE_ROLE=x \
          -e ALLOWED_ORIGINS=http://localhost:18080 -e PRODUCTION_URL=http://localhost:18080 \
          -e ADMIN_EMAIL=test@example.com -e RESUME_FILE=JordanKailResume.pdf \
          -e ANTHROPIC_API_KEY=x -e SENDGRID_API_KEY=x \
          portfolio-ci:latest
        for i in $(seq 1 20); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/ || true)
          [ "$STATUS" = "200" ] && exit 0
          sleep 1
        done
        echo "Container never became ready"
        docker logs portfolio-e2e
        exit 1

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install Playwright
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run E2E smoke test
      working-directory: e2e
      run: npx playwright test

    - name: Run Lighthouse CI budget assertions
      working-directory: e2e
      run: npx lhci autorun --config=./lighthouserc.json

    - name: Tear down E2E container
      if: always()
      run: docker rm -f portfolio-e2e || true
