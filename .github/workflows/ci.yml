name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Test
      run: npm test

    - name: Build
      run: npm run build

  backend:
    name: Backend (install, import check)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Byte-compile backend
      run: python -m compileall -q backend

    - name: Import check
      env:
        ANTHROPIC_API_KEY: ci-placeholder
      run: |
        python -c "import backend.app.api.chat_routes, backend.app.api.telemetry_routes, \
        backend.app.api.admin_routes, backend.app.api.health_routes, \
        backend.app.middleware.auth_middleware, backend.app.utils.logger, \
        backend.app.utils.supabase_client"
