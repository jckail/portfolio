name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Test (with coverage gate)
      run: npm run test:coverage

    - name: Build
      run: npm run build

  backend:
    name: Backend (compile, test)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Lint (ruff)
      run: python -m ruff check backend

    - name: Byte-compile backend
      run: python -m compileall -q backend

    - name: Test (with coverage gate)
      run: python -m pytest backend/tests -q --cov --cov-report=term-missing

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '~1.9'

    - name: Format check
      run: terraform fmt -check -recursive

    - name: Init (no backend)
      run: terraform init -backend=false

    - name: Validate
      run: terraform validate

  docker:
    name: Docker (build production image)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: helpers/Dockerfile.prod
        push: false
        load: true
        tags: portfolio-ci:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image for critical/high CVEs
      uses: aquasecurity/trivy-action@0.36.0
      with:
        image-ref: portfolio-ci:latest
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true
