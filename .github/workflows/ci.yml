name: CI

on:
  push:
    branches: [ main ]
  # Validate stacked feature PRs as well as PRs targeting main.
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Use Node.js 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Production dependencies only: dev tooling advisories are surfaced by
    # Dependabot, but a high in what ships fails the build.
    - name: Audit npm dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check

    # Both are also enforced inside the lint and test steps above (the ESLint
    # import/no-restricted-paths zone, and src/styles/css-vars.test.ts). They
    # are repeated here as their own named steps so a failure says what broke,
    # and so someone loosening the ESLint zone or skipping the test does not
    # silently drop the invariant.
    - name: Boundary check (shared/ and types/ must not import app/)
      run: |
        if grep -rEn "from ['\"](\.\./)+app/|from ['\"]@/app/" src/shared src/types; then
          echo "::error::shared/ and types/ must not import from app/"
          exit 1
        fi

    - name: Undefined CSS custom property check
      run: npx vitest run src/styles/css-vars.test.ts

    - name: Test (with coverage gate)
      run: npm run test:coverage

    - name: Build
      run: npm run build

  backend:
    name: Backend (compile, test)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Use Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements-dev.lock.txt

    # Same hash-verified pins the production image installs, plus the test
    # tools (requirements-dev.lock.txt is constrained by the production lock,
    # so every shared package resolves to the same version).
    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements.lock.txt
        pip install --require-hashes -r requirements-dev.lock.txt

    - name: Audit Python dependencies (pip-audit)
      run: |
        pipx run pip-audit --disable-pip -r requirements.lock.txt
        pipx run pip-audit --disable-pip -r requirements-dev.lock.txt

    - name: Test deployment authorization guard
      run: python3 -m unittest discover -s helpers -p test_verify_deployment.py -v

    - name: Test stale revision tag cleanup
      run: python3 -m unittest discover -s helpers -p test_cleanup_revision_tags.py -v

    - name: Lint (ruff)
      run: python -m ruff check backend

    - name: Byte-compile backend
      run: python -m compileall -q backend

    - name: Test (with coverage gate)
      run: python -m pytest backend/tests -q --cov --cov-report=term-missing

    # A single global floor cannot notice a poorly-covered auth layer inside a
    # well-covered codebase: the auth surface sat at 39.8% while the total was
    # 69.8%, and a mutation probe confirmed the whole admin auth layer could be
    # deleted with every test still passing. This gate watches that surface on
    # its own. Ratchet upward only.
    - name: Auth-surface coverage gate
      run: |
        python -m coverage report --fail-under=91 \
          --include='backend/app/middleware/*,backend/app/api/admin_routes.py'

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: '1.9.8'

    # Provider downloads dominate this job. The lock file pins versions, so it
    # is a sound cache key.
    - name: Cache Terraform providers
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.terraform.d/plugin-cache
        key: tf-plugins-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl', 'infra/versions.tf') }}

    - name: Prepare plugin cache directory
      run: |
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    # A google_apikeys_key resource writes the key string into state. Keys are
    # created and rotated with gcloud (infra/README.md), never by Terraform.
    - name: Guard against Terraform-managed API keys and secret values
      run: |
        if grep -nE 'resource +"google_apikeys_key"|google_service_account_key' *.tf; then
          echo "::error::API keys and service-account keys must not be managed by Terraform (they land in state)"
          exit 1
        fi

    - name: Format check
      run: terraform fmt -check -recursive

    - name: Init (no backend)
      run: terraform init -backend=false

    - name: Validate
      run: terraform validate

  docker:
    name: Docker (build production image)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build image (no push)
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: helpers/Dockerfile.prod
        push: false
        load: true
        tags: portfolio-ci:latest
        cache-from: type=gha,scope=ci
        cache-to: type=gha,mode=max,scope=ci

    - name: Scan image for critical/high CVEs
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: portfolio-ci:latest
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true

    - name: Run container for E2E smoke test
      run: |
        docker run -d --name portfolio-e2e -p 18080:8080 \
          -e PORT=8080 \
          -e SUPABASE_URL=https://example.supabase.co \
          -e SUPABASE_ANON_KEY=x -e SUPABASE_SERVICE_ROLE=x \
          -e ALLOWED_ORIGINS=http://localhost:18080 -e PRODUCTION_URL=http://localhost:18080 \
          -e ADMIN_EMAIL=test@example.com -e RESUME_FILE=JordanKailResume.pdf \
          -e ANTHROPIC_API_KEY=x -e SENDGRID_API_KEY=x \
          portfolio-ci:latest
        for i in $(seq 1 20); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/ || true)
          [ "$STATUS" = "200" ] && exit 0
          sleep 1
        done
        echo "Container never became ready"
        docker logs portfolio-e2e
        exit 1

    - name: Use Node.js 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

    - name: Install Playwright
      working-directory: e2e
      run: |
        npm ci
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          # Browser binaries are cached; system libraries are not.
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Run E2E smoke test
      working-directory: e2e
      run: npx playwright test

    - name: Run Lighthouse CI budget assertions
      working-directory: e2e
      run: npx lhci autorun --config=./lighthouserc.json

    - name: Upload Lighthouse and Playwright results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: e2e-results
        path: |
          e2e/lhci-results
          e2e/test-results
          e2e/playwright-report
        if-no-files-found: ignore
        retention-days: 7

    - name: Tear down E2E container
      if: always()
      run: docker rm -f portfolio-e2e || true
