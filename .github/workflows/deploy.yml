name: Deploy

# Deploys to Cloud Run on pushes to main (or manually via workflow_dispatch).
#
# Authentication uses Workload Identity Federation — no service-account keys.
# Provision the WIF pool/provider and deployer service account with the
# Terraform config in infra/ (set the github_repository variable), then add
# these repository secrets from the Terraform outputs:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
#   GCP_DEPLOYER_SERVICE_ACCOUNT    <service>-deployer@<project>.iam.gserviceaccount.com
# and these repository variables:
#   GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE, AR_REPOSITORY

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production image without cloud credentials
    runs-on: ubuntu-latest
    if: github.repository == 'jckail/portfolio' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
    steps:
    - name: Require a fresh deployment run
      run: |
        if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
          echo "::error::Deployment reruns are blocked. Start a new Deploy workflow run on main."
          exit 1
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: helpers/Dockerfile.prod
        push: false
        tags: portfolio-deploy:${{ github.sha }}
        outputs: type=docker,dest=${{ runner.temp }}/portfolio.tar
    - name: Scan image before publishing or authenticating
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        input: ${{ runner.temp }}/portfolio.tar
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true
    - name: Upload this run's build
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: production-image
        path: ${{ runner.temp }}/portfolio.tar
        retention-days: 1
        compression-level: 0

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Skip gracefully on forks / repos where deployment is not configured
    if: github.repository == 'jckail/portfolio' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    needs: build
    environment: production

    permissions:
      contents: read
      id-token: write
      actions: read

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'quickresume' }}
      REPOSITORY: ${{ vars.AR_REPOSITORY || 'portfolio' }}

    steps:
    - name: Require a fresh deployment run
      run: |
        if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
          echo "::error::Deployment reruns are blocked. Start a new Deploy workflow run on main."
          exit 1
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Download this run's build
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: production-image
        path: ${{ runner.temp }}/image

    - name: Require successful CI for current main
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 helpers/verify_deployment.py --wait-seconds 1200

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

    - name: Load and push this run's build
      shell: bash
      run: |
        docker load --input "$RUNNER_TEMP/image/portfolio.tar"
        IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
        docker tag "portfolio-deploy:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
        docker tag "portfolio-deploy:${GITHUB_SHA}" "${IMAGE}:latest"
        docker push "${IMAGE}:${GITHUB_SHA}"
        # --quiet prints the pushed tag, not its digest. Read the local engine's
        # registry manifest identity recorded by the successful push instead.
        DIGEST=$(docker image inspect --format '{{json .RepoDigests}}' "portfolio-deploy:${GITHUB_SHA}" | \
          jq -er --arg image "$IMAGE" '[.[] | select(startswith($image + "@"))] | unique | if length == 1 then .[0] | split("@")[1] else error("Expected one pushed repository digest") end')
        if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::Push did not return one valid image digest"
          exit 1
        fi
        echo "DEPLOY_IMAGE=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
        docker push "${IMAGE}:latest"

    # Deploy the new revision with zero live traffic, verify it directly
    # via its own tagged URL, and only then promote to 100%. This closes
    # the previous gap where `gcloud run deploy` routed all production
    # traffic to the new revision *before* the health check ran — a
    # broken image was briefly live. If verification fails here, no
    # traffic is ever shifted and the prior revision keeps serving
    # unaffected; rollback is documented in HANDOFF.md.
    - name: Deploy new revision (no traffic yet)
      run: |
        TAG="gh-${GITHUB_SHA::7}"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        gcloud run deploy "$SERVICE" \
          --project "$PROJECT_ID" \
          --region "$REGION" \
          --image "$DEPLOY_IMAGE" \
          --update-env-vars "GIT_COMMIT=${GITHUB_SHA}" \
          --cpu-boost \
          --startup-probe="httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=5,periodSeconds=5,failureThreshold=24,timeoutSeconds=3" \
          --no-traffic \
          --tag="$TAG" \
          --quiet

    - name: Verify new revision before promoting
      run: |
        SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
          --project "$PROJECT_ID" --region "$REGION" --format=json)
        CANARY_URL=$(jq -er --arg TAG "$TAG" '.status.traffic[] | select(.tag == $TAG) | .url' <<< "$SERVICE_JSON")
        REVISION=$(jq -er --arg TAG "$TAG" '.status.traffic[] | select(.tag == $TAG) | .revisionName' <<< "$SERVICE_JSON")
        echo "REVISION=$REVISION" >> "$GITHUB_ENV"
        RESOLVED_IMAGE=$(gcloud run revisions describe "$REVISION" \
          --project "$PROJECT_ID" --region "$REGION" --format='value(status.imageDigest)')
        if [ "$RESOLVED_IMAGE" != "$DEPLOY_IMAGE" ]; then
          echo "::error::New revision does not match the pushed image digest"
          exit 1
        fi
        if [ -z "$CANARY_URL" ]; then
          echo "Could not resolve the tagged revision URL for $TAG"
          exit 1
        fi
        echo "Verifying new revision at: $CANARY_URL"
        for i in $(seq 1 12); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$CANARY_URL/api/health" || true)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed"
            exit 0
          fi
          echo "Attempt $i: health returned $STATUS; retrying in 5s..."
          sleep 5
        done
        echo "Health check failed — leaving traffic on the previous revision"
        exit 1

    - name: Recheck current main and CI immediately before promotion
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 helpers/verify_deployment.py

    - name: Promote new revision to 100% traffic
      run: |
        gcloud run services update-traffic "$SERVICE" \
          --project "$PROJECT_ID" --region "$REGION" \
          --to-revisions="${REVISION}=100" --quiet

    - name: Verify production traffic
      run: |
        URL=$(gcloud run services describe "$SERVICE" \
          --project "$PROJECT_ID" --region "$REGION" \
          --format 'value(status.url)')
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
        if [ "$STATUS" != "200" ]; then
          echo "Production health check failed after promotion ($STATUS)"
          exit 1
        fi
        echo "Production healthy at $URL"

    - name: Remove stale automated revision tags after verified promotion
      run: python3 helpers/cleanup_revision_tags.py

    - name: Remove this failed canary tag when its identity is known
      if: failure() && env.TAG != '' && env.REVISION != ''
      run: python3 helpers/cleanup_revision_tags.py --failed-canary
